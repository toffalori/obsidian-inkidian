# Pushing a tag that matches the version in manifest.json (for example 0.1.0)
# builds the plugin and publishes a release with main.js, manifest.json and styles.css.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Check the tag matches manifest.json
        run: test "${GITHUB_REF#refs/tags/}" = "$(node -p 'require("./manifest.json").version')"
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" --generate-notes main.js manifest.json styles.css
